name: graspvla_boundary_probe_v1
track: graspvla_boundary
scene_catalog: graspvla_boundary_probe_v1
catalog:
  boundary_native:
    - id: banana
      label: banana
    - id: ceramic_bowl
      label: ceramic bowl
    - id: power_drill
      label: power drill
  transparent:
    - id: clear_plastic_cup
      label: clear plastic cup
    - id: glass_bottle
      label: glass bottle
    - id: wine_glass
      label: wine glass
    - id: acrylic_box
      label: acrylic box
task_groups:
  - name: language_conditioned_single_target_pick
    object_group: boundary_native
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
    instruction_template: "pick up {object}"
    attempts_per_trial: 3
    conditions:
      - basic
      - lighting
      - background
      - distractors
      - height
  - name: language_paraphrase_grab
    object_group: boundary_native
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
    instruction_template: "grab the {object}"
    attempts_per_trial: 3
    conditions:
      - basic
  - name: language_paraphrase_lift
    object_group: boundary_native
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
    instruction_template: "lift the {object}"
    attempts_per_trial: 3
    conditions:
      - basic
  - name: language_paraphrase_pickup
    object_group: boundary_native
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
    instruction_template: "pick the {object} up"
    attempts_per_trial: 3
    conditions:
      - basic
  - name: arbitrary_grasping_transparent
    object_group: transparent
    object_ids:
      - clear_plastic_cup
      - glass_bottle
      - wine_glass
      - acrylic_box
    instruction_template: "pick up any object"
    attempts_per_trial: 3
    conditions:
      - transparent
object_groups:
  - boundary_native
  - transparent
metrics:
  - task_success
  - spl
  - attempts_to_success
  - inference_latency
  - cycle_time
failure_taxonomy:
  - grounding_error
  - segmentation_error
  - bad_grasp_proposal
  - planner_failure
  - collision
  - slip
  - occlusion
  - ambiguous_language
