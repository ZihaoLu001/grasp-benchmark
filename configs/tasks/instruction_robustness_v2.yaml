name: instruction_robustness_v2
track: track_a_instruction
scene_catalog: graspvla_track_a_playground_cal_v3
catalog:
  native_opaque_cal:
    - id: banana
      label: banana
    - id: ceramic_bowl
      label: ceramic bowl
    - id: power_drill
      label: power drill
    - id: carrot
      label: carrot
    - id: watermelon
      label: watermelon
task_groups:
  - name: language_conditioned_single_target_pick
    object_group: native_opaque_cal
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
      - carrot
      - watermelon
    instruction_template: "pick up {object}"
    instruction_variants:
      - id: canonical
        family: canonical
        template: "pick up {object}"
      - id: lexical
        family: lexical_paraphrase
        template: "grab the {object}"
      - id: compositional
        family: compositional_paraphrase
        template: "move to the {object} and lift it"
      - id: disambiguation
        family: distractor_aware_disambiguation
        template: "pick up the target {object}, not any surrounding object"
    attempts_per_trial: 3
    conditions:
      - name: basic
        variant_count: 1
      - name: distractors_light
        variant_count: 1
object_groups:
  - native_opaque_cal
metrics:
  - task_success
  - spl
  - attempts_to_success
  - inference_latency
  - cycle_time
  - paraphrase_consistency_rate
  - worst_case_success_rate
  - canonical_to_variant_success_drop
failure_taxonomy:
  - grounding_error
  - segmentation_error
  - bad_grasp_proposal
  - planner_failure
  - collision
  - slip
  - occlusion
  - ambiguous_language
