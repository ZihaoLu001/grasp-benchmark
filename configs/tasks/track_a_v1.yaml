name: track_a_v1
display_name: Deprecated Shared-Benchmark Draft
collaborator_name: Deprecated Shared-Benchmark Draft
track: track_a
catalog:
  ycb_core:
    - id: red_mug
      label: red mug
    - id: mustard_bottle
      label: mustard bottle
    - id: banana
      label: banana
    - id: ceramic_bowl
      label: ceramic bowl
    - id: power_drill
      label: power drill
  transparent:
    - id: clear_plastic_cup
      label: clear plastic cup
    - id: glass_bottle
      label: glass bottle
    - id: wine_glass
      label: wine glass
    - id: acrylic_box
      label: acrylic box
task_groups:
  - name: language_conditioned_single_target_pick
    object_group: ycb_core
    object_ids:
      - red_mug
      - mustard_bottle
      - banana
      - ceramic_bowl
      - power_drill
    instruction_template: "pick up {object}"
    attempts_per_trial: 3
    conditions:
      - basic
      - lighting
      - background
      - distractors
      - height
  - name: arbitrary_grasping_transparent
    object_group: transparent
    object_ids:
      - clear_plastic_cup
      - glass_bottle
      - wine_glass
      - acrylic_box
    instruction_template: "pick up any object"
    attempts_per_trial: 3
    conditions:
      - transparent
object_groups:
  - ycb_core
  - transparent
metrics:
  - task_success
  - spl
  - attempts_to_success
  - inference_latency
  - cycle_time
failure_taxonomy:
  - grounding_error
  - segmentation_error
  - bad_grasp_proposal
  - planner_failure
  - collision
  - slip
  - occlusion
  - ambiguous_language
