name: track_b_cgn_official_depth_segmap_v1
display_name: Contact-GraspNet Official-Input Validation Suite
public_name: Contact-GraspNet Official-Input Validation Suite
track: track_b_native
claim_boundary: official_contact_graspnet_proposal_path_with_benchmark_owned_execution
scene_catalog: graspvla_track_b_cgn_native_v2
catalog:
  native_opaque_cal:
    - id: banana
      label: banana
    - id: ceramic_bowl
      label: ceramic bowl
    - id: power_drill
      label: power drill
    - id: carrot
      label: carrot
    - id: watermelon
      label: watermelon
  transparent:
    - id: clear_plastic_cup
      label: clear plastic cup
    - id: glass_bottle
      label: glass bottle
    - id: wine_glass
      label: wine glass
    - id: acrylic_box
      label: acrylic box
task_groups:
  - name: language_conditioned_single_target_pick
    object_group: native_opaque_cal
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
      - carrot
      - watermelon
    instruction_template: "pick up {object}"
    attempts_per_trial: 3
    conditions:
      - name: basic
        variant_count: 6
      - name: distractors_light
        variant_count: 6
  - name: arbitrary_grasping_common_opaque
    object_group: native_opaque_cal
    object_ids:
      - banana
      - ceramic_bowl
      - power_drill
      - carrot
      - watermelon
    instruction_template: "pick up any object"
    attempts_per_trial: 3
    conditions:
      - name: opaque_basic
        variant_count: 6
  - name: arbitrary_grasping_transparent
    object_group: transparent
    object_ids:
      - clear_plastic_cup
      - glass_bottle
      - wine_glass
      - acrylic_box
    instruction_template: "pick up any object"
    attempts_per_trial: 3
    conditions:
      - name: transparent_pose_bank
        variant_count: 12
object_groups:
  - native_opaque_cal
  - transparent
metrics:
  - task_success
  - spl
  - attempts_to_success
  - inference_latency
  - cycle_time
failure_taxonomy:
  - segmentation_error
  - bad_grasp_proposal
  - planner_failure
  - collision
  - slip
  - occlusion
