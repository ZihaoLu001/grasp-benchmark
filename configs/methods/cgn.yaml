name: cgn
display_name: Contact-GraspNet + Segmentation + Grounding DINO + Motion Planner
benchmark_method_tier: cgn_full_modular
env_name: gb-cgn
preferred_nodes:
  - em14
  - rll_6000_1
  - rll_6000_2
upstreams:
  - contact_graspnet
  - GroundingDINO
  - curobo
sim:
  runner: benchmark_wrapper
  uses_depth: true
  execution_mode: shared_track_a_sim
  scene_catalog: graspvla_track_a_playground_v1
  scene_catalog_by_task_set:
    track_a_cal_v1: graspvla_track_a_playground_cal_v1
    track_a_cal_v2: graspvla_track_a_playground_cal_v2
    track_a_cal_v3: graspvla_track_a_playground_cal_v3
    track_a_v2: graspvla_track_a_playground_v2
    track_a_stress_v2: graspvla_track_a_playground_stress_v2
    track_a_stress_v3: graspvla_track_a_playground_stress_v3
    protocol_probe_v2: graspvla_track_a_playground_probe_v2
    protocol_and_transfer_suite_v1: graspvla_protocol_and_transfer_suite_v1
    cgn_bottleneck_v1: graspvla_track_a_playground_probe_v2
    track_b_cgn_native_v1: graspvla_track_b_cgn_native_v1
groundingdino:
  config_relpath: third_party/upstreams/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py
  checkpoint_relpath: third_party/upstreams/GroundingDINO/weights/groundingdino_swint_ogc.pth
  checkpoint_url: https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
  box_threshold: 0.25
  text_threshold: 0.2
  device: cuda
segmentation:
  min_pixels: 96
  depth_quantile: 0.2
  depth_band_m: 0.03
  fallback_depth_quantile: 0.1
  fallback_depth_band_m: 0.04
planner:
  use_grasp_pose: true
  single_plan_per_attempt: true
  approach_clearance_m: 0.08
  grasp_offset_m: 0.015
  lift_height_m: 0.18
  pregrasp_min_z_m: 0.5
  split_hover_waypoints: true
  hover_raise_m: 0.1
  chunk_size_m: 0.02
  close_steps: 2
  pregrasp_settle_steps: 6
  grasp_settle_steps: 6
  post_close_settle_steps: 6
  replan_action_horizon: 0
native_track_b:
  top_k_retry: 3
  planner:
    single_plan_per_attempt: false
    replan_action_horizon: 6
    use_grasp_pose: true
    split_hover_waypoints: true
    hover_raise_m: 0.12
    pregrasp_settle_steps: 4
    grasp_settle_steps: 4
    post_close_settle_steps: 4
    close_steps: 2
track_a_input_policy:
  observation_contract: shared_observation
  consumes:
    - rgb_front
    - depth_front
    - intrinsics_front
    - extrinsics_front
    - proprio
    - instruction
  ignores:
    - rgb_side
    - depth_side
    - intrinsics_side
    - extrinsics_side
  scene_edit_policy: shared_only
legacy_env_name: gb-cgn-tf22
checkpoint_relpath: checkpoints/scene_test_2048_bs3_hor_sigma_001
formal_downsample_stride: 1
smoke_downsample_stride: 4
task_runtime_overrides:
  track_b_cgn_native_v1:
    native_multiview_fusion: true
    native_top_k: 5
    planner_overrides:
      single_plan_per_attempt: false
      use_grasp_pose: true
