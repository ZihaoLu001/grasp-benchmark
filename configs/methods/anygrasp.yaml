name: anygrasp
display_name: AnyGrasp + Grounding DINO + Motion Planner
benchmark_method_tier: anygrasp_full_modular
env_name: gb-anygrasp
preferred_nodes:
  - em14
  - rll_6000_1
  - rll_6000_2
upstreams:
  - anygrasp_sdk
  - GroundingDINO
  - curobo
sim:
  runner: benchmark_wrapper
  uses_depth: true
  execution_mode: shared_track_a_sim
  scene_catalog: graspvla_track_a_playground_v1
  scene_catalog_by_task_set:
    track_a_cal_v1: graspvla_track_a_playground_cal_v1
    track_a_cal_v2: graspvla_track_a_playground_cal_v2
    track_a_cal_v3: graspvla_track_a_playground_cal_v3
    track_a_v2: graspvla_track_a_playground_v2
    track_a_stress_v2: graspvla_track_a_playground_stress_v2
    track_a_stress_v3: graspvla_track_a_playground_stress_v3
    protocol_probe_v2: graspvla_track_a_playground_probe_v2
    protocol_and_transfer_suite_v1: graspvla_protocol_and_transfer_suite_v1
track_a_input_policy:
  observation_contract: shared_observation
  consumes:
    - rgb_front
    - depth_front
    - intrinsics_front
    - extrinsics_front
    - proprio
    - instruction
  ignores:
    - rgb_side
    - depth_side
    - intrinsics_side
    - extrinsics_side
  scene_edit_policy: shared_only
groundingdino:
  config_relpath: third_party/upstreams/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py
  checkpoint_relpath: third_party/upstreams/GroundingDINO/weights/groundingdino_swint_ogc.pth
  checkpoint_url: https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
  box_threshold: 0.25
  text_threshold: 0.2
  device: cuda
segmentation:
  min_pixels: 96
  depth_quantile: 0.2
  depth_band_m: 0.03
  fallback_depth_quantile: 0.1
  fallback_depth_band_m: 0.04
planner:
  single_plan_per_attempt: true
  approach_clearance_m: 0.08
  grasp_offset_m: 0.015
  lift_height_m: 0.18
  chunk_size_m: 0.04
  close_steps: 2
checkpoint_relpath: log/checkpoint_detection.tar
license_cfg_relpath: license/licenseCfg.json
