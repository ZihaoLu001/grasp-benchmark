name: graspvla
display_name: GraspVLA
benchmark_method_tier: graspvla_official
env_name: gb-core
preferred_nodes:
  - em14
upstreams:
  - GraspVLA
  - GraspVLA-playground
  - GraspVLA-real-world-controller
hf_repo: shengliangd/GraspVLA
model_cache_dir: /datasets/ss/current/zihao/hf_cache/graspvla
model_glob: "*.safetensors"
server:
  host: 127.0.0.1
  port: 6666
  compile: true
official_sim_env_name: gb-graspvla-sim
track_a_input_policy:
  observation_contract: shared_observation
  consumes:
    - rgb_front
    - rgb_side
    - proprio
    - instruction
  ignores:
    - depth_front
    - depth_side
    - intrinsics_front
    - intrinsics_side
    - extrinsics_front
    - extrinsics_side
  scene_edit_policy: shared_only
  native_reference_track: track_b_native
sim:
  runner: benchmark_wrapper
  execution_mode: shared_track_a_sim
  scene_catalog: graspvla_track_a_playground_v1
  scene_catalog_by_task_set:
    track_a_cal_v1: graspvla_track_a_playground_cal_v1
    track_a_cal_v2: graspvla_track_a_playground_cal_v2
    track_a_cal_v3: graspvla_track_a_playground_cal_v3
    instruction_robustness_v1: graspvla_track_a_playground_cal_v3
    instruction_robustness_v2: graspvla_track_a_playground_cal_v3
    sim2real_proxy_v1: graspvla_sim2real_proxy_v1
    sim2real_proxy_v2: graspvla_sim2real_proxy_v2
    track_a_v2: graspvla_track_a_playground_v2
    track_a_stress_v2: graspvla_track_a_playground_stress_v2
    track_a_stress_v3: graspvla_track_a_playground_stress_v3
    track_a_stress_v4: graspvla_track_a_playground_stress_v4
    protocol_probe_v2: graspvla_track_a_playground_probe_v2
    protocol_and_transfer_suite_v1: graspvla_protocol_and_transfer_suite_v1
    phase2_pilot_v1: graspvla_phase2_pilot_v1
  control_freq: 5
  stabilization_steps: 10
