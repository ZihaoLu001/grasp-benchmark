[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-benchmark"
version = "0.1.0"
description = "Fair benchmark scaffold for end-to-end and modular grasping systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zihao Lu" }
]
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0,<7",
  "transforms3d>=0.4,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
